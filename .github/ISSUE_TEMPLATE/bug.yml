name: Bug
description: Algo não funciona como deveria
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: O que aconteceu?
      description: Descreva o problema. Prints ou gifs ajudam muito.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Como reproduzir
      placeholder: |
        1. Comece uma partida
        2. Ande para a esquerda por 30 segundos
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: O que você esperava que acontecesse?
  - type: input
    id: browser
    attributes:
      label: Navegador e sistema
      placeholder: Chrome 140 no Windows 11
  - type: textarea
    id: console
    attributes:
      label: Erros no console (F12)
      render: text
